name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create GitHub Pages entry file
        run: |
          PHOTO_FILE=$(find dist/client/assets -name 'ashish-kottakota-photo-optimized-*.webp' | head -n 1 | sed 's#dist/client##')
          cat > dist/client/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Ashish Kottakota | Python Full Stack Developer</title>
              <meta name="description" content="Portfolio of Ashish Kottakota, Python full stack developer skilled in React, FastAPI, cloud, microservices, Kafka, and scalable systems." />
              <link rel="canonical" href="https://kottakotaasshish.github.io/" />
              <style>
                :root{color-scheme:light;--bg:#f8f6ef;--fg:#17233b;--muted:#5f6978;--hero:#172c48;--card:#fffdf8;--line:#ded7c7;--primary:#245eb8;--accent:#e8b651;--soft:#edf7f3}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;text-rendering:optimizeLegibility}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}.hero{background:var(--hero);color:#fbfaf5}.wrap{width:min(1120px,100%);margin:auto;padding:0 20px}.hero-grid{min-height:88vh;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:28px}.nav{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;font-weight:700;color:rgba(251,250,245,.78);margin-bottom:80px}.eyebrow{display:inline-flex;border:1px solid rgba(251,250,245,.16);background:rgba(251,250,245,.08);border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px}.hero h1{font-size:clamp(48px,8vw,88px);line-height:1;margin:24px 0 18px;letter-spacing:0}.lead{font-size:clamp(18px,2.2vw,22px);max-width:720px;color:rgba(251,250,245,.8)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;padding:0 18px;font-weight:850}.btn.primary{background:var(--accent);color:#281f08}.btn.ghost{border:1px solid rgba(251,250,245,.22);background:rgba(251,250,245,.08);color:#fbfaf5}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:72px;max-width:620px}.metric{border:1px solid rgba(251,250,245,.14);background:rgba(251,250,245,.08);border-radius:12px;padding:16px}.metric strong{display:block;font-size:30px}.metric span{font-size:13px;color:rgba(251,250,245,.72);font-weight:750}.photo-card{max-width:360px;margin-left:auto;border:1px solid rgba(251,250,245,.14);background:rgba(251,250,245,.08);border-radius:18px;padding:16px}.photo-card img{width:260px;height:260px;object-fit:cover;border-radius:12px;margin:auto}.summary{background:var(--card);color:var(--fg);border-radius:12px;margin-top:18px;padding:20px}.section{padding:72px 0}.section.soft{background:#f0eee6}.section-label{color:var(--primary);font-size:13px;text-transform:uppercase;font-weight:900}.section h2{font-size:clamp(30px,4vw,46px);line-height:1.08;margin:10px 0 26px}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 18px 42px -32px rgba(20,42,72,.45)}.card h3,.job h3{margin:0 0 10px;font-size:22px}.muted{color:var(--muted)}.jobs{display:grid;gap:16px}.job{display:grid;grid-template-columns:.75fr 1.25fr;gap:28px}.period{color:var(--primary);font-weight:900;font-size:14px}.wins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px;padding:0;list-style:none}.wins li{background:#eeeadf;border-radius:8px;padding:10px;font-size:13px;font-weight:800;color:var(--muted)}.bottom{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.contact{background:var(--hero);color:#fbfaf5}.contact p{color:rgba(251,250,245,.76)}@media(max-width:860px){.hero-grid,.job,.bottom{grid-template-columns:1fr}.nav{margin-bottom:42px}.photo-card{margin:0;max-width:100%}.photo-card img{width:220px;height:220px}.metrics,.skills,.wins{grid-template-columns:1fr}.hero-grid{min-height:auto;padding-block:28px 56px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
              </style>
            </head>
            <body>
              <main>
                <section class="hero">
                  <div class="wrap hero-grid">
                    <div>
                      <nav class="nav" aria-label="Primary navigation"><a href="mailto:kottakotashish99@gmail.com">Email</a><a href="https://github.com/kottakotaasshish">GitHub</a><a href="https://www.linkedin.com/in/kottakota-ashish">LinkedIn</a><a href="/ashish-kottakota-resume.docx" download>Resume</a></nav>
                      <span class="eyebrow">Senior Python Full Stack Developer</span>
                      <h1>Ashish Kottakota</h1>
                      <p class="lead">I build scalable product systems with React, TypeScript, Python, FastAPI, cloud platforms, microservices, and event-driven architecture.</p>
                      <div class="actions"><a class="btn primary" href="/ashish-kottakota-resume.docx" download>Download resume</a><a class="btn ghost" href="mailto:kottakotashish99@gmail.com">Contact me</a></div>
                      <div class="metrics"><div class="metric"><strong>8+</strong><span>years experience</span></div><div class="metric"><strong>35%</strong><span>faster page loads</span></div><div class="metric"><strong>40%</strong><span>throughput gain</span></div></div>
                    </div>
                    <aside class="photo-card" aria-label="Profile summary"><img src="$PHOTO_FILE" width="480" height="480" alt="Ashish Kottakota professional headshot" fetchpriority="high"><div class="summary"><h2>Reliable full stack delivery</h2><p class="muted">Production experience across retail, healthcare, cloud, and distributed platforms. Based in USA.</p></div></aside>
                  </div>
                </section>
                <section class="section"><div class="wrap"><p class="section-label">Technical toolkit</p><h2>Modern engineering stack for dependable products.</h2><div class="skills"><article class="card"><h3>Frontend</h3><p class="muted">React, TypeScript, Redux Toolkit, Tailwind CSS, Chart.js</p></article><article class="card"><h3>Backend</h3><p class="muted">Python, FastAPI, Django, Flask, GraphQL, WebSockets</p></article><article class="card"><h3>Data</h3><p class="muted">PostgreSQL, MySQL, MongoDB, Cassandra, Redis</p></article><article class="card"><h3>Cloud</h3><p class="muted">AWS, GCP, Docker, Kubernetes, Jenkins, GitHub Actions</p></article></div></div></section>
                <section class="section soft"><div class="wrap"><p class="section-label">Experience</p><h2>Impact across enterprise software teams.</h2><div class="jobs"><article class="job"><div><p class="period">Apr 2024 — Present</p><h3>The Home Depot</h3><p class="muted"><b>Senior Software Developer</b> · Atlanta, GA</p></div><div><ul class="wins"><li>Improved page-load performance by 35%</li><li>Increased system throughput by 40%</li><li>Reduced release cycles by 50%</li></ul><p class="muted">React, TypeScript, Tailwind CSS, FastAPI, Flask, Kafka, PostgreSQL, Docker, Kubernetes, AWS EKS</p></div></article><article class="job"><div><p class="period">Feb 2022 — Mar 2024</p><h3>NextGen Health Care</h3><p class="muted"><b>Software Developer</b> · Atlanta, GA</p></div><div><ul class="wins"><li>Built real-time dashboards</li><li>Implemented WebSocket updates</li><li>Automated deployments with GitLab CI</li></ul><p class="muted">React, Chart.js, Django, FastAPI, Celery, RabbitMQ, Redis, PostgreSQL, GCP, Kubernetes</p></div></article><article class="job"><div><p class="period">Jan 2020 — Jan 2022</p><h3>American Eagle Outfitters</h3><p class="muted"><b>Software Developer</b> · New York, NY</p></div><div><ul class="wins"><li>Built retail e-commerce workflows</li><li>Optimized MySQL queries</li><li>Improved release automation</li></ul><p class="muted">React, Flask, SQLAlchemy, MySQL, Docker, AWS EC2, RDS, Jenkins, PyTest</p></div></article><article class="job"><div><p class="period">Jul 2018 — Dec 2019</p><h3>HashTag Technologies</h3><p class="muted"><b>Software Developer</b> · Coimbatore</p></div><div><ul class="wins"><li>Developed responsive interfaces</li><li>Supported Flask APIs</li><li>Validated APIs with Postman and Swagger</li></ul><p class="muted">HTML5, CSS3, JavaScript, Bootstrap, React, Python, Flask, Docker, Git</p></div></article></div></div></section>
                <section class="section"><div class="wrap bottom"><article class="card"><h2>Education</h2><p class="muted"><b>M.S. Computer Science</b><br>California State University Fullerton, California</p><p class="muted"><b>B.S. Computer Science</b><br>BML Munjal University, Gurgaon, India</p></article><article class="card contact"><h2>Let’s build reliable software.</h2><p>Open to senior full stack, backend, and cloud-focused engineering roles.</p><div class="actions"><a class="btn primary" href="mailto:kottakotashish99@gmail.com">Email</a><a class="btn ghost" href="https://www.linkedin.com/in/kottakota-ashish">LinkedIn</a><a class="btn ghost" href="https://github.com/kottakotaasshish">GitHub</a></div></article></div></section>
              </main>
            </body>
          </html>
          EOF
          cp dist/client/index.html dist/client/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4