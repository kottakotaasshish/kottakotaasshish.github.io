name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create GitHub Pages entry file
        run: |
          CSS_FILE=$(find dist/client/assets -name 'styles-*.css' | head -n 1 | sed 's#dist/client##')
          JS_FILE=$(find dist/client/assets -name 'main-*.js' | head -n 1 | sed 's#dist/client##')
          cat > dist/client/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Ashish Kottakota — Python Full Stack Developer</title>
              <meta name="description" content="Portfolio of Ashish Kottakota, a Python full stack developer specializing in React, FastAPI, microservices, cloud, and distributed systems." />
              <link rel="stylesheet" href="$CSS_FILE" />
            </head>
            <body>
              <script type="module" src="$JS_FILE"></script>
            </body>
          </html>
          EOF
          cp dist/client/index.html dist/client/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4